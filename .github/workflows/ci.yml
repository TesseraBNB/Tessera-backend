name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      # v1 binaries are built with an older Go and refuse go.mod's `go 1.25`.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  # The frontend lives in its own repo (TesseraBNB/Tessera-frontend) with its own CI.

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tessera:ci .
