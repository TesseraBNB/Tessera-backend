# golangci-lint v2 configuration for the Tessera Go backend.
# v1 binaries are built with an older Go and refuse go.mod's `go 1.25`.
version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    staticcheck:
      # v2 defaults, minus QF1012 (WriteString(fmt.Sprintf) -> fmt.Fprintf):
      # a style quick-fix that v1's staticcheck linter never ran.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1012"]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
